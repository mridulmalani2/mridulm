name: CI

# Runs the dual-engine test gates on every push and pull request (refactor plan
# P1-6 / P4-7): TypeScript (vitest) + build, and Python (pytest). A red gate
# blocks merge, enforcing the mirroring rule in ENGINE_ARCHITECTURE.md.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  typescript:
    name: TypeScript engine (vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npx vitest run
      - name: Type check + production build
        run: npm run build

  python:
    name: Python engine (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # numpy_financial / scipy are intentionally NOT installed — the IRR solver
      # has a pure-Python fallback that must keep working without them.
      # openpyxl is required only by the Excel-export gate (tests/test_excel_export.py).
      - run: python -m pip install --upgrade pip pydantic pytest openpyxl
      - name: Unit tests
        run: python -m pytest tests/ -q
