name: CI

# Runs the engine test gates on every push and pull request (refactor plan
# P1-6 / P4-7): TypeScript (vitest) + type-check/build. A red gate blocks merge.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  typescript:
    name: TypeScript engine (vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npx vitest run
      - name: Type check + production build
        run: npm run build
